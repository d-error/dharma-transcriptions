[tool.poetry]
name = "dharma-transcriptions"
version = "0.1.0"
description = ""
authors = ["Diego Guerreiro <diego.g.bernardes@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.12.7"
flask = "^3.1.0"
yt-dlp = "^2024.12.6"
whisper = "^1.1.10"
python-dotenv = "^1.0.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
taskipy = "^1.14.1"
ruff = "^0.8.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check .; ruff check . --diff'
format = 'ruff check . --fix; ruff format .'
run = 'flask run'
pre_test = 'task lint'
test = 'pytest -s -x --cov=dharma_transcriptions -vv'
post_test = 'coverage html'